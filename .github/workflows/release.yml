name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Verify release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' repohealth | sed -n '1p')"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag version ${GITHUB_REF_NAME#v} does not match repohealth version $version" >&2
            exit 1
          fi

      - name: Check shell syntax
        run: |
          bash -n repohealth
          bash -n install.sh

      - name: Test
        run: ./tests/run

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release already exists: $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
